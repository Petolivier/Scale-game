<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon RPG Multijoueur</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14161c; color: #e8e8ee; font-family: system-ui, sans-serif; }
  #app { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; justify-content: center; align-items: flex-start; }
  #wrap { position: relative; max-width: 100%; }
  canvas { background: #000; border: 2px solid #2c3040; border-radius: 6px; max-width: 100%; display: block; }
  #toast { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.78);
           padding: 6px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; }
  .panel { background: #1e2230; border: 2px solid #2c3040; border-radius: 6px; padding: 12px; width: 270px; }
  .panel h2 { margin: 0 0 8px; font-size: 18px; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #2c3040; font-size: 14px; }
  .stat span:first-child { color: #9aa3bd; }
  .bar { height: 14px; background: #3a1d1d; border-radius: 7px; overflow: hidden; margin: 6px 0 10px; }
  .bar > div { height: 100%; background: #d63c3c; width: 100%; transition: width .2s; }
  #status { font-size: 12px; color: #9aa3bd; margin-top: 10px; line-height: 1.4; }
  #playerList { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
  #playerList li { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #playerList small { color: #7f88a3; margin-left: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #zoneName { font-size: 13px; color: #ffd24c; margin-bottom: 4px; }
  #minimap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  #minimap .cell { position: relative; background: #14161c; border: 1px solid #2c3040; border-radius: 4px; font-size: 9px;
                   line-height: 1.1; height: 44px; padding: 3px; color: #9aa3bd; overflow: hidden;
                   display: flex; align-items: center; justify-content: center; text-align: center; }
  #minimap .cell.here { background: #2b4a8c; color: #fff; border-color: #4c8dff; }
  #minimap .cell b { position: absolute; top: 1px; right: 3px; color: #ffd24c; font-size: 10px; }
  #dpad { display: none; grid-template-columns: repeat(3, 48px); gap: 4px; margin-top: 10px; justify-content: center; }
  #dpad button { height: 48px; font-size: 20px; background: #2c3040; color: #fff; border: 0; border-radius: 6px; }
  @media (pointer: coarse) { #dpad { display: grid; } }

  #creation { position: fixed; inset: 0; background: rgba(10,12,18,.92); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #creation .box { background: #1e2230; border: 2px solid #3a4160; border-radius: 10px; padding: 20px; width: 340px; max-width: 94vw; }
  #creation h1 { margin: 0 0 12px; font-size: 22px; }
  #creation label { display: block; font-size: 13px; color: #9aa3bd; margin-top: 8px; }
  #creation input[type=text] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #3a4160; background: #14161c; color: #fff; }
  #creation input[type=color] { width: 60px; height: 32px; border: 0; background: none; }
  .alloc { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; }
  .alloc .ctrl button { width: 28px; height: 28px; border-radius: 6px; border: 0; background: #2c3040; color: #fff; font-size: 16px; cursor: pointer; }
  .alloc .ctrl span { display: inline-block; min-width: 40px; text-align: center; }
  #startBtn { width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 6px; background: #4c8dff; color: #fff; font-size: 16px; cursor: pointer; }
  #pointsLeft { font-weight: bold; color: #ffd24c; }
</style>
</head>
<body>

<div id="creation">
  <div class="box">
    <h1>Crée ton personnage</h1>
    <label>Nom</label>
    <input type="text" id="nameInput" maxlength="14" placeholder="Ton pseudo">
    <label>Couleur</label>
    <input type="color" id="colorInput" value="#4c8dff">

    <button id="startBtn">Entrer dans le monde</button>
  </div>
</div>

<div id="app">
  <div id="wrap">

    <div id="toast"></div>
  </div>
  <div class="panel">

    <div id="minimap"></div>
    <div id="dpad">
      <span></span><button data-dir="up">▲</button><span></span>
      <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
    </div>
    <h2 style="margin-top:14px;font-size:15px">Joueurs en ligne</h2>
    <ul id="playerList"></ul>
    <div id="status">Déplacement : flèches ou Z Q S D<br>L : afficher / masquer les noms des zones</div>
  </div>
</div>

<script type="module">
// =====================================================================
// 1) CONFIGURATION FIREBASE (à remplir pour activer le multijoueur)
//    Tant que apiKey vaut "COLLE_ICI", le jeu tourne en mode solo.
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDkQw_tpfIsCP5LPojjQTthGth6O1noceQ",
  authDomain: "scale-game-78b94.firebaseapp.com",
  databaseURL: "https://scale-game-78b94-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "scale-game-78b94",
  appId: "1:38420099292:web:c07722bd8639438e040419"

const ONLINE = firebaseConfig.apiKey !== "COLLE_ICI";

// ==== WORLD START ====
// =====================================================================
// 2) LE MONDE : 4 x 3 zones, chaque zone fait 24 x 16 cases
// =====================================================================
const TILE = 32, COLS = 24, ROWS = 16;
const GRASS = 0, PATH = 1, WHEAT = 2, WATER = 3, TREE = 4, ROCK = 5, BUILD = 6, FENCE = 7, CAVE = 8;
const BLOCKING = new Set([WATER, TREE, ROCK, BUILD, FENCE]);
const WORLD_W = 4, WORLD_H = 3;

// Liaisons (les flèches rouges de ton schéma).
// LINKS_H["x,y"] = ligne de passage entre la zone (x,y) et la zone à sa droite
// LINKS_V["x,y"] = colonne de passage entre la zone (x,y) et la zone en dessous
const LINKS_H = { "0,0": 7, "1,0": 7, "2,0": 7, "0,2": 7, "1,2": 7, "2,2": 7 };
const LINKS_V = { "0,0": 12, "1,0": 12, "3,0": 12, "0,1": 12, "1,1": 12, "2,1": 12, "3,1": 12 };

function exitsFor(zx, zy) {
  const ex = {};
  const e = LINKS_H[`${zx},${zy}`], w = LINKS_H[`${zx - 1},${zy}`];
  const s = LINKS_V[`${zx},${zy}`], n = LINKS_V[`${zx},${zy - 1}`];
  if (e !== undefined) ex.E = { pos: e, zx: zx + 1, zy };
  if (w !== undefined) ex.W = { pos: w, zx: zx - 1, zy };
  if (s !== undefined) ex.S = { pos: s, zx, zy: zy + 1 };
  if (n !== undefined) ex.N = { pos: n, zx, zy: zy - 1 };
  return ex;
}

// ---------- Petit outil de construction de zone ----------
function makeGrid(seed) {
  const t = Array.from({ length: ROWS }, () => Array(COLS).fill(GRASS));
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const g = {
    t, rnd, buildings: [], labels: [], animals: [], flowerList: [],
    set(x, y, v) { if (x >= 0 && y >= 0 && x < COLS && y < ROWS) t[y][x] = v; },
    rect(x, y, w, h, v) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) g.set(i, j, v); },
    ellipse(cx, cy, rx, ry, v) {
      for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++)
        if (((i + .5 - cx) / rx) ** 2 + ((j + .5 - cy) / ry) ** 2 <= 1) t[j][i] = v;
    },
    scatter(v, x, y, w, h, d) {
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
        if (i >= 0 && j >= 0 && i < COLS && j < ROWS && t[j][i] === GRASS && rnd() < d) t[j][i] = v;
    },
    road(pts, w = 2) {            // chemin large de 2 cases
      for (let k = 1; k < pts.length; k++) {
        const [x1, y1] = pts[k - 1], [x2, y2] = pts[k];
        const n = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1), 1);
        for (let i = 0; i <= n; i++)
          g.rect(Math.round(x1 + (x2 - x1) * i / n), Math.round(y1 + (y2 - y1) * i / n), w, w, PATH);
      }
    },
    flowers(x, y, w, h, d) {
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
        if (rnd() < d) g.flowerList.push({ x: i, y: j, c: Math.floor(rnd() * 4) });
    },
    building(kind, x, y, w, h, label, color) {
      g.rect(x, y, w, h, BUILD);
      g.buildings.push({ kind, x, y, w, h, label, color });
      if (label) g.labels.push({ text: label, x: x + w / 2, y: kind === "fountain" ? y + h + 0.55 : y - 0.1, poi: true });
    },
    label(text, x, y) { g.labels.push({ text, x, y, poi: false }); },
    poi(text, x, y) { g.labels.push({ text, x, y, poi: true }); },
  };
  return g;
}

// Ouvre les sorties, pose la bordure naturelle
function finalize(g, exits, border) {
  const st = 3;
  if (exits.E) g.rect(COLS - st, exits.E.pos, st, 2, PATH);
  if (exits.W) g.rect(0, exits.W.pos, st, 2, PATH);
  if (exits.N) g.rect(exits.N.pos, 0, 2, st, PATH);
  if (exits.S) g.rect(exits.S.pos, ROWS - st, 2, st, PATH);
  const opening = (x, y) =>
    (exits.E && x === COLS - 1 && y >= exits.E.pos && y <= exits.E.pos + 1) ||
    (exits.W && x === 0 && y >= exits.W.pos && y <= exits.W.pos + 1) ||
    (exits.N && y === 0 && x >= exits.N.pos && x <= exits.N.pos + 1) ||
    (exits.S && y === ROWS - 1 && x >= exits.S.pos && x <= exits.S.pos + 1);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const edge = x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1;
    if (edge && !opening(x, y)) g.t[y][x] = border;
    const ring = !edge && (x === 1 || y === 1 || x === COLS - 2 || y === ROWS - 2);
    if (ring && g.t[y][x] === GRASS && g.rnd() < 0.5) g.t[y][x] = border;
  }
}

// ---------- Les 12 zones (voir ton schéma) ----------
const ZONES = {

    g.road([[0, 7], [23, 7]]);
    g.road([[12, 8], [12, 15]]);
    g.road([[6, 4], [6, 7]]); g.road([[17, 4], [17, 7]]);   // sentiers vers les moulins
    g.building("mill", 5, 1, 3, 3, "Moulin");
    g.building("mill", 16, 1, 3, 3, "Moulin");
    g.label("Champs de blé + moulins", 12.5, 3.5);
    g.label("Champs de blé", 5.5, 12.5); g.label("Début de forêt", 19, 12.5);

  "2,0": { name: "Forêt", short: "Forêt", border: TREE, build(g) {
    g.scatter(TREE, 1, 1, 22, 6, 0.75);
    g.scatter(TREE, 1, 9, 22, 6, 0.75);

    g.label("Forêt", 12.5, 3.5); g.label("Forêt", 8, 12.5);

  "3,0": { name: "Forêt Sombre", short: "Forêt Sombre", border: TREE, build(g) {
    g.scatter(TREE, 1, 1, 22, 14, 0.70);
    g.ellipse(12, 7, 4.5, 3.2, GRASS);    // la clairière
    for (let k = 0; k < 8; k++) {         // cercle de pierres
      if (k === 2 || k === 4) continue;
      const a = k * Math.PI / 4;
      g.set(Math.round(12 + 4.2 * Math.cos(a)), Math.round(7 + 3 * Math.sin(a)), ROCK);
    }
    g.flowers(8, 4, 9, 7, 0.35);
    g.road([[0, 7], [9, 7]]);
    g.road([[12, 10], [12, 15]]);
    g.label("Forêt", 4.5, 3.5);
  }},

  // ===== Ligne du milieu =====
  "0,1": { name: "Chemin du vadrouilleur", short: "Chemin du vadrouilleur", border: TREE, build(g) {
    g.scatter(TREE, 1, 1, 9, 6, 0.40);    // début de forêt
    g.scatter(TREE, 1, 9, 10, 6, 0.04);
    g.scatter(TREE, 15, 9, 8, 6, 0.04);
    g.ellipse(18, 4, 3.5, 2.5, WATER);    // lac
    g.road([[12, 0], [12, 15]]);
    g.flowers(1, 9, 10, 6, 0.12); g.flowers(15, 9, 8, 6, 0.12);
    g.label("Début de forêt", 5.5, 3.5); g.label("Lac", 18, 4);
    g.label("Plaine", 5.5, 12.5); g.label("Plaine", 18.5, 12.5);
  }},
  "1,1": { name: "Champs", short: "Champs", border: TREE, build(g) {
    g.rect(1, 1, 9, 6, WHEAT);
    g.rect(1, 9, 9, 6, WHEAT);
    g.rect(15, 9, 8, 6, WHEAT);
    g.ellipse(19, 4, 3.8, 3, ROCK);       // morceau de montagne
    g.road([[12, 0], [12, 15]]);
    g.label("Champs de blé", 5.5, 3.5); g.label("Morceau de montagne", 19, 4);
    g.label("Champs de blé", 5.5, 12.5); g.label("Champs de blé", 18.5, 12.5);
  }},
  "2,1": { name: "Montagne", short: "Montagne", border: ROCK, tint: "rgba(120,100,60,.18)", build(g) {
    g.ellipse(5, 4, 5, 3.3, ROCK);        // morceau de montagne (haut gauche)
    g.ellipse(18.5, 4, 5, 3.3, ROCK);     // morceau de montagne (haut droite)
    g.ellipse(12.5, 2.5, 3.2, 2.8, ROCK); // massif central
    g.ellipse(5, 11.5, 5, 3, ROCK);       // morceau de montagne (bas gauche)
    g.scatter(TREE, 15, 9, 8, 6, 0.20);   // léger bois
    g.road([[12, 6], [12, 15]]);
    g.set(11, 5, ROCK); g.set(14, 5, ROCK);
    g.set(12, 5, CAVE); g.set(13, 5, CAVE);   // entrée de la grotte
    g.poi("Entrée de la grotte", 13, 4.6);
    g.label("Morceau de montagne", 5, 4); g.label("Morceau de montagne", 18.5, 4);
    g.label("Morceau de montagne", 5, 11.5); g.label("Léger bois", 19, 12.5);

  "3,1": { name: "Forêt", short: "Forêt", border: TREE, build(g) {
    g.scatter(TREE, 1, 1, 8, 14, 0.80);
    g.scatter(TREE, 15, 1, 8, 14, 0.80);
    g.scatter(TREE, 9, 1, 6, 14, 0.12);
    g.road([[12, 0], [12, 15]]);
    g.label("Forêt", 4.5, 7.5); g.label("Forêt", 19, 7.5);
  }},

  // ===== Ligne du bas =====
  "0,2": { name: "Village : BarkTown", short: "BarkTown", border: TREE, style: "stone", build(g) {

    g.road([[17, 7], [23, 7]]);           // route de l'est

    g.building("fountain", 11, 7, 2, 2, "Fontaine");

  }},

    g.label("Plaine", 13, 12.5);

    g.scatter(TREE, 1, 1, 22, 5, 0.22);   // léger bois

    g.animals.push({ kind: "cow", x: 15.5, y: 11.5 }, { kind: "cow", x: 19.5, y: 12.5 }, { kind: "cow", x: 21.2, y: 10.8 },
                   { kind: "sheep", x: 17.2, y: 13 }, { kind: "sheep", x: 18.4, y: 10.9 }, { kind: "sheep", x: 16.5, y: 12 });
    g.label("Léger bois", 12.5, 3.5); g.label("Plaine", 5.5, 12.5); g.label("Champs d'animaux", 18, 9.6);
  }},
  "3,2": { name: "Clairière lumineuse", short: "Clairière lumineuse", border: TREE, build(g) {
    g.scatter(TREE, 15, 1, 8, 6, 0.40);   // début de forêt

    g.label("Début de forêt", 19, 3.5); g.label("Plaine", 12.5, 12.5);
  }},
};

const zoneCache = {};
function getZone(zx, zy) {
  const id = `${zx},${zy}`;
  if (zoneCache[id]) return zoneCache[id];
  const def = ZONES[id];
  const g = makeGrid(1000 + zx * 37 + zy * 101);
  def.build(g);
  const exits = exitsFor(zx, zy);
  finalize(g, exits, def.border);
  return (zoneCache[id] = {
    id, zx, zy, name: def.name, short: def.short, tiles: g.t, exits,
    buildings: g.buildings, labels: g.labels, animals: g.animals, flowerList: g.flowerList,
    style: def.style || "dirt", tint: def.tint || null, canvas: null,
  });
}
// ==== WORLD END ====

// =====================================================================
// 3) STATISTIQUES
// =====================================================================
const STAT_DEFS = [
  { key: "pv",           label: "PV (Points de vie)",        base: 100, perPoint: 10 },
  { key: "force",        label: "Force (Attaque)",           base: 5,   perPoint: 1 },
  { key: "intelligence", label: "Intelligence (Att. magique)", base: 5, perPoint: 1 },
  { key: "endurance",    label: "Endurance (Défense)",       base: 5,   perPoint: 1 },
  { key: "resilience",   label: "Résilience (Déf. magique)", base: 5,   perPoint: 1 },
  { key: "vitesse",      label: "Vitesse",                   base: 5,   perPoint: 1 },
];
const START_POINTS = 10;

// ---------- Écran de création ----------
const alloc = {};
STAT_DEFS.forEach(s => alloc[s.key] = 0);
let pointsLeft = START_POINTS;

const allocList = document.getElementById("allocList");
function renderAlloc() {
  allocList.innerHTML = "";
  STAT_DEFS.forEach(s => {
    const row = document.createElement("div");
    row.className = "alloc";
    row.innerHTML = `<span>${s.label}</span>
      <span class="ctrl"><button data-k="${s.key}" data-d="-1">−</button>
      <span>${s.base + alloc[s.key] * s.perPoint}</span>
      <button data-k="${s.key}" data-d="1">+</button></span>`;
    allocList.appendChild(row);
  });
  document.getElementById("pointsLeft").textContent = pointsLeft;
}
allocList.addEventListener("click", e => {

let me = null;

function computeStats() {

// Départ : sur la place du village BarkTown (zone 0,2)
const SPAWNS = [[8, 9], [9, 9], [10, 9], [13, 9], [14, 9], [9, 6], [15, 6], [8, 6]];
const START_ZONE = [0, 2];

const sameZone = o => o.zx === me.zx && o.zy === me.zy;
const othersHere = () => Object.values(others).filter(sameZone);

document.getElementById("startBtn").addEventListener("click", () => {

function enterZone(zx, zy) {
  me.zx = zx; me.zy = zy;
  zone = getZone(zx, zy);
  if (!zone.canvas) zone.canvas = renderStatic(zone);
  banner = { text: zone.name, t: performance.now() };

// 5) MULTIJOUEUR (Firebase Realtime Database)

function publicData() {
  return { name: me.name, color: me.color, x: me.x, y: me.y, zx: me.zx, zy: me.zy, hp: me.hp, pv: me.stats.pv, t: Date.now() };
}

async function connect() {
  const status = document.getElementById("status");
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getDatabase, ref, set, update, onValue, onDisconnect } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    myRef = ref(db, "players/" + myId);
    fbUpdate = update;
    await set(myRef, publicData());
    onDisconnect(myRef).remove();

    onValue(ref(db, "players"), snap => {
      const data = snap.val() || {};
      for (const id in others) if (!data[id]) { delete others[id]; delete display[id]; }
      for (const id in data) {
        if (id === myId) continue;
        const prev = others[id];
        others[id] = data[id];
        if (!display[id] || !prev || prev.zx !== data[id].zx || prev.zy !== data[id].zy)
          display[id] = { x: data[id].x, y: data[id].y };
      }
      refreshLists();
    });
    status.innerHTML = "Connecté au multijoueur<br>Déplacement : flèches ou Z Q S D<br>L : afficher / masquer les noms des zones";
  } catch (err) {
    console.error(err);
    status.innerHTML = "Connexion Firebase impossible : mode solo.<br>Vérifie ta configuration (voir la console, F12).";
  }
}

function syncMe() {
  if (myRef && fbUpdate) fbUpdate(myRef, publicData()).catch(() => {});
}

const keys = {};
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  z: "up", s: "down", q: "left", d: "right", Z: "up", S: "down", Q: "left", D: "right",
};
window.addEventListener("keydown", e => {
  if (e.key === "l" || e.key === "L") { showLabels = !showLabels; return; }
  const d = KEYMAP[e.key];
  if (d) { keys[d] = true; if (e.key.startsWith("Arrow")) e.preventDefault(); }
});
window.addEventListener("keyup", e => { const d = KEYMAP[e.key]; if (d) keys[d] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll("#dpad button").forEach(b => {
  const d = b.dataset.dir;
  const on = ev => { ev.preventDefault(); keys[d] = true; };
  const off = ev => { ev.preventDefault(); keys[d] = false; };
  b.addEventListener("touchstart", on); b.addEventListener("touchend", off);
  b.addEventListener("mousedown", on);  b.addEventListener("mouseup", off);
});

const moveDelay = () => Math.max(120, 260 - me.stats.vitesse * 4);

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = 0, 3000);
}

function tryMove(dx, dy) {
  const nx = me.x + dx, ny = me.y + dy;
  // Sortie de la zone ?
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
    const dir = dx > 0 ? "E" : dx < 0 ? "W" : dy > 0 ? "S" : "N";
    const ex = zone.exits[dir];
    if (!ex) return false;
    const c = (dir === "E" || dir === "W") ? me.y : me.x;
    if (c < ex.pos || c > ex.pos + 1) return false;
    if (dir === "E") me.x = 0;
    if (dir === "W") me.x = COLS - 1;
    if (dir === "S") me.y = 0;
    if (dir === "N") me.y = ROWS - 1;
    enterZone(ex.zx, ex.zy);
    return true;
  }
  const t = zone.tiles[ny][nx];
  if (BLOCKING.has(t)) return false;
  if (othersHere().some(o => o.x === nx && o.y === ny)) return false;
  me.x = nx; me.y = ny;
  if (t === CAVE) toast("L'entrée de la grotte est bloquée par des éboulis… (bientôt disponible)");
  syncMe();
  return true;
}

function handleInput(now) {
  if (!me || now - me.lastMove < moveDelay()) return;
  let dx = 0, dy = 0;
  if (keys.up) dy = -1; else if (keys.down) dy = 1;
  else if (keys.left) dx = -1; else if (keys.right) dx = 1;
  if (!dx && !dy) return;
  if (tryMove(dx, dy)) me.lastMove = now;
}

// =====================================================================
// 7) DESSIN DE LA CARTE (le décor est dessiné une seule fois par zone)
// =====================================================================
function hash(x, y, s = 0) {
  let h = Math.imul(x + 1, 374761393) ^ Math.imul(y + 1, 668265263) ^ Math.imul(s + 1, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); c.fill(); }
const FLOWER_COLORS = ["#ffd24c", "#ff7aa8", "#ffffff", "#b48cff"];
function drawFlower(c, px, py, k) { c.fillStyle = FLOWER_COLORS[k]; c.fillRect(px, py, 3, 3); c.fillStyle = "#fff7c2"; c.fillRect(px + 1, py + 1, 1, 1); }

function drawGround(c, z, x, y, seed) {
  const T = z.tiles[y][x], px = x * TILE, py = y * TILE, r = hash(x, y, seed);
  if (T === PATH) {
    const stone = z.style === "stone";
    c.fillStyle = stone ? (r < .5 ? "#a4a4b0" : "#9b9ba7") : (r < .5 ? "#c9a96e" : "#bf9f64");
    c.fillRect(px, py, TILE, TILE);
    c.fillStyle = stone ? "rgba(0,0,0,.12)" : "rgba(90,60,20,.18)";
    for (let i = 0; i < 4; i++) c.fillRect(px + hash(x, y, seed + i + 10) * 28, py + hash(x, y, seed + i + 20) * 28, 3, 2);
    if (stone) { c.strokeStyle = "rgba(0,0,0,.15)"; c.strokeRect(px + .5, py + .5, TILE - 1, TILE - 1); }
  } else if (T === WATER) {
    c.fillStyle = "#2f74d6"; c.fillRect(px, py, TILE, TILE);
    if (!z.tiles[y - 1] || z.tiles[y - 1][x] !== WATER) { c.fillStyle = "#5b9af0"; c.fillRect(px, py, TILE, 4); }
    c.fillStyle = "rgba(255,255,255,.22)";
    c.fillRect(px + 4 + r * 8, py + 9, 12, 2); c.fillRect(px + 10, py + 20 + Math.floor(r * 4), 10, 2);
  } else if (T === WHEAT) {
    c.fillStyle = "#d9b63c"; c.fillRect(px, py, TILE, TILE);
    for (let i = 0; i < 4; i++) { c.fillStyle = "#c79f2b"; c.fillRect(px + 3 + i * 8, py, 3, TILE); }
    c.fillStyle = "#f1d467";
    for (let i = 0; i < 6; i++) c.fillRect(px + hash(x, y, seed + i + 30) * 28, py + hash(x, y, seed + i + 40) * 26, 2, 5);
  } else {
    c.fillStyle = r < .33 ? "#4a9a48" : r < .66 ? "#459444" : "#4f9f4d";
    c.fillRect(px, py, TILE, TILE);
    c.fillStyle = "rgba(20,70,20,.35)";
    for (let i = 0; i < 3; i++) c.fillRect(px + hash(x, y, seed + i + 50) * 28, py + hash(x, y, seed + i + 60) * 26, 1, 4);
    if (z.tint) { c.fillStyle = z.tint; c.fillRect(px, py, TILE, TILE); }
    if (T === GRASS && hash(x, y, seed + 5) < 0.05)
      drawFlower(c, px + hash(x, y, seed + 6) * 26 + 2, py + hash(x, y, seed + 7) * 26 + 2, Math.floor(hash(x, y, seed + 8) * 4));
  }
}

function drawTree(c, px, py, r) {
  c.fillStyle = "rgba(0,0,0,.22)"; c.beginPath(); c.ellipse(px + 16, py + 29, 11, 4, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#6b4423"; c.fillRect(px + 13, py + 18, 6, 11);
  if (r < .35) {      // sapin
    c.fillStyle = "#1d5e2c"; poly(c, [px + 16, py - 6, px + 5, py + 12, px + 27, py + 12]);
    c.fillStyle = "#26743a"; poly(c, [px + 16, py + 1, px + 2, py + 21, px + 30, py + 21]);
  } else {            // feuillu
    c.fillStyle = "#1f6b2a"; c.beginPath(); c.arc(px + 16, py + 13, 12 + r * 2, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#2f8f3d"; c.beginPath(); c.arc(px + 12, py + 9, 7, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#3aa84b"; c.beginPath(); c.arc(px + 20, py + 8, 4, 0, Math.PI * 2); c.fill();

}

  c.fillStyle = "rgba(0,0,0,.2)"; c.beginPath(); c.ellipse(px + 16, py + 30, 14, 3, 0, 0, Math.PI * 2); c.fill();

function drawFence(c, z, x, y, px, py) {
  const f = (xx, yy) => z.tiles[yy] && z.tiles[yy][xx] === FENCE;

  if (f(x, y - 1) || f(x, y + 1)) { c.fillRect(px + 14, py, 4, TILE); }
  c.fillStyle = "#6b4423"; c.fillRect(px + 13, py + 6, 6, 22);

function drawCave(c, px, py, rightIsCave) {
  c.save(); c.beginPath(); c.rect(px, py, TILE, TILE); c.clip();
  c.fillStyle = "#6b6f7d"; c.fillRect(px, py, TILE, TILE);
  const cx = rightIsCave ? px + TILE : px, cy = py + 30;
  c.fillStyle = "#4a4d59"; c.beginPath(); c.arc(cx, cy, 25, Math.PI, 0); c.lineTo(cx + 25, py + 40); c.lineTo(cx - 25, py + 40); c.fill();
  c.fillStyle = "#0b0b12"; c.beginPath(); c.arc(cx, cy, 20, Math.PI, 0); c.lineTo(cx + 20, py + 40); c.lineTo(cx - 20, py + 40); c.fill();
  c.restore();
}

function renderStatic(z) {
  const cv = document.createElement("canvas");
  cv.width = COLS * TILE; cv.height = ROWS * TILE;
  const c = cv.getContext("2d");
  const seed = z.zx * 7 + z.zy * 13;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawGround(c, z, x, y, seed);
  for (const f of z.flowerList) if (z.tiles[f.y][f.x] === GRASS) drawFlower(c, f.x * TILE + 6 + (f.c * 5) % 18, f.y * TILE + 8 + (f.c * 7) % 16, f.c);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const T = z.tiles[y][x], px = x * TILE, py = y * TILE, r = hash(x, y, seed + 99);
    if (T === TREE) drawTree(c, px, py, r);
    else if (T === ROCK) drawRock(c, px, py, r);
    else if (T === FENCE) drawFence(c, z, x, y, px, py);
    else if (T === CAVE) drawCave(c, px, py, z.tiles[y][x + 1] === CAVE);
  }
  for (const b of z.buildings) BUILDING_DRAW[b.kind](c, b);
  return cv;
}

// ---------- Éléments animés / dessinés à chaque image ----------
function drawBlades(b, t) {
  const cx = b.x * TILE + b.w * TILE / 2, cy = b.y * TILE + 40;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t / 1500);
  for (let k = 0; k < 4; k++) {
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = "#6b4423"; ctx.fillRect(-2, 0, 4, 38);
    ctx.fillStyle = "#f3ead2"; ctx.fillRect(2, 6, 12, 30);
    ctx.strokeStyle = "#b9a67e"; ctx.lineWidth = 1; ctx.strokeRect(2, 6, 12, 30);
  }
  ctx.restore();
  ctx.fillStyle = "#4a2f17"; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
}
function drawAnimal(a, t) {
  const px = a.x * TILE, py = a.y * TILE + Math.sin(t / 500 + a.x * 3) * 1.5;
  ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(px, py + 9, 11, 3, 0, 0, Math.PI * 2); ctx.fill();
  if (a.kind === "cow") {
    ctx.fillStyle = "#3a3a3a"; ctx.fillRect(px - 8, py + 3, 3, 7); ctx.fillRect(px + 4, py + 3, 3, 7);
    ctx.fillStyle = "#fafafa"; ctx.beginPath(); ctx.ellipse(px, py, 11, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.ellipse(px - 4, py - 1, 3.5, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px + 3, py + 2, 2.5, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fafafa"; ctx.fillRect(px + 8, py - 7, 8, 8);
    ctx.fillStyle = "#f2a0a8"; ctx.fillRect(px + 13, py - 2, 4, 3);
    ctx.fillStyle = "#222"; ctx.fillRect(px + 11, py - 5, 2, 2);
  } else {
    ctx.fillStyle = "#3a3a3a"; ctx.fillRect(px - 5, py + 4, 2, 6); ctx.fillRect(px + 3, py + 4, 2, 6);
    ctx.fillStyle = "#f4f4f0";
    for (const [dx, dy] of [[-6, 0], [0, -3], [6, 0], [-2, 3], [4, 3]]) { ctx.beginPath(); ctx.arc(px + dx, py + dy, 6, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#2c2c2c"; ctx.beginPath(); ctx.arc(px + 10, py - 1, 4, 0, Math.PI * 2); ctx.fill();
  }
}
function drawLabels() {
  ctx.textAlign = "center";
  for (const l of zone.labels) {
    if (!l.poi && !showLabels) continue;
    ctx.font = l.poi ? "bold 11px system-ui" : "italic 11px system-ui";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.85)";
    ctx.strokeText(l.text, l.x * TILE, l.y * TILE);
    ctx.fillStyle = l.poi ? "#fff" : "#cfe8ff";
    ctx.fillText(l.text, l.x * TILE, l.y * TILE);
  }
}
function drawPlayer(p, pos, isMe) {
  const px = pos.x * TILE, py = pos.y * TILE;
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(px + 16, py + 28, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = p.color; ctx.fillRect(px + 6, py + 6, 20, 20);
  ctx.strokeStyle = isMe ? "#fff" : "#000"; ctx.lineWidth = 2; ctx.strokeRect(px + 6, py + 6, 20, 20);
  ctx.fillStyle = "#fff"; ctx.fillRect(px + 10, py + 12, 4, 4); ctx.fillRect(px + 18, py + 12, 4, 4);
  ctx.fillStyle = "#000"; ctx.fillRect(px + 12, py + 13, 2, 2); ctx.fillRect(px + 20, py + 13, 2, 2);
  const maxHp = p.stats ? p.stats.pv : p.pv;
  const ratio = Math.max(0, Math.min(1, p.hp / maxHp));
  ctx.fillStyle = "#400"; ctx.fillRect(px + 4, py - 2, 24, 4);
  ctx.fillStyle = "#e33"; ctx.fillRect(px + 4, py - 2, 24 * ratio, 4);
  ctx.font = "11px system-ui"; ctx.textAlign = "center";
  ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(p.name, px + 16, py - 6);
  ctx.fillStyle = isMe ? "#ffd24c" : "#fff"; ctx.fillText(p.name, px + 16, py - 6);
}
function drawBanner(now) {
  if (!banner) return;
  const age = now - banner.t;
  if (age > 3000) { banner = null; return; }
  ctx.globalAlpha = age < 2300 ? 1 : 1 - (age - 2300) / 700;
  ctx.font = "bold 20px system-ui"; ctx.textAlign = "center";
  const w = ctx.measureText(banner.text).width + 36;
  ctx.fillStyle = "rgba(10,12,18,.75)"; ctx.fillRect(canvas.width / 2 - w / 2, 14, w, 36);
  ctx.fillStyle = "#ffd24c"; ctx.fillText(banner.text, canvas.width / 2, 40);
  ctx.globalAlpha = 1;
}

function loop(now) {
  handleInput(now);
  const here = othersHere();
  const targets = { [myId]: me };
  here.forEach(o => { const id = Object.keys(others).find(k => others[k] === o); targets[id] = o; });
  for (const id in targets) {
    const d = display[id] || (display[id] = { x: targets[id].x, y: targets[id].y });
    d.x += (targets[id].x - d.x) * 0.35;
    d.y += (targets[id].y - d.y) * 0.35;
  }
  ctx.drawImage(zone.canvas, 0, 0);
  for (const b of zone.buildings) if (b.kind === "mill") drawBlades(b, now);
  for (const a of zone.animals) drawAnimal(a, now);
  const list = Object.keys(targets).map(id => ({ id, p: targets[id], me: id === myId }));
  list.sort((a, b) => display[a.id].y - display[b.id].y);
  list.forEach(o => drawPlayer(o.p, display[o.id], o.me));
  drawBanner(now);
  requestAnimationFrame(loop);
}

// =====================================================================
// 8) INTERFACE (panneau de statistiques, mini-carte, liste des joueurs)
// =====================================================================
function renderPanel() {
  document.getElementById("pName").textContent = me.name;
  document.getElementById("pvText").textContent = `${me.hp} / ${me.stats.pv}`;
  document.getElementById("pvBar").style.width = (me.hp / me.stats.pv * 100) + "%";
  const labels = {
    force: "Force (Attaque)", intelligence: "Intelligence (Att. magique)",
    endurance: "Endurance (Défense)", resilience: "Résilience (Déf. magique)", vitesse: "Vitesse",
  };
  const list = document.getElementById("statsList");
  list.innerHTML = "";
  for (const k in labels) list.innerHTML += `<div class="stat"><span>${labels[k]}</span><span>${me.stats[k]}</span></div>`;
}

function refreshLists() {
  if (!me) return;
  // mini-carte
  const mm = document.getElementById("minimap");
  mm.innerHTML = "";
  for (let y = 0; y < WORLD_H; y++) for (let x = 0; x < WORLD_W; x++) {
    const count = Object.values(others).filter(o => o.zx === x && o.zy === y).length + (me.zx === x && me.zy === y ? 1 : 0);
    const d = document.createElement("div");
    d.className = "cell" + (me.zx === x && me.zy === y ? " here" : "");
    d.innerHTML = `<span>${ZONES[`${x},${y}`].short}</span>` + (count ? `<b>${count}</b>` : "");
    mm.appendChild(d);
  }
  // liste des joueurs
  const ul = document.getElementById("playerList");
  ul.innerHTML = "";
  const all = [{ name: me.name + " (toi)", color: me.color, zx: me.zx, zy: me.zy }, ...Object.values(others)];
  all.forEach(p => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="dot" style="background:${p.color}"></span>`;
    li.appendChild(document.createTextNode(p.name));
    const sm = document.createElement("small");
    sm.textContent = ZONES[`${p.zx},${p.zy}`] ? ZONES[`${p.zx},${p.zy}`].short : "";
    li.appendChild(sm);
    ul.appendChild(li);
  });
}
